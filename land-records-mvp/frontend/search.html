<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Properties - Delhi Land Records</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-blue-600">Delhi Land Records</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-700 hover:text-blue-600 px-3 py-2">Home</a>
                    <a href="/search" class="text-blue-600 font-semibold px-3 py-2">Search</a>
                    <a href="/compare" class="text-gray-700 hover:text-blue-600 px-3 py-2">Compare</a>
                    <a href="/about" class="text-gray-700 hover:text-blue-600 px-3 py-2">About</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Search Properties</h1>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Filter Sidebar -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h2 class="text-xl font-semibold mb-4">Filters</h2>

                    <form id="searchForm">
                        <!-- Locality -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Locality</label>
                            <select id="locality" name="locality" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-300">
                                <option value="">All Localities</option>
                                <option value="Greater Kailash I">Greater Kailash I</option>
                                <option value="Greater Kailash II">Greater Kailash II</option>
                                <option value="Greater Kailash III">Greater Kailash III</option>
                                <option value="Chitranjan Park">Chitranjan Park</option>
                            </select>
                        </div>

                        <!-- Plot Number -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Plot Number</label>
                            <input type="text" id="plotNumber" name="plot_number" placeholder="e.g., A-123" class="w-full px-3 py-2 border rounded-lg">
                        </div>

                        <!-- Area Range -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Area (sqm)</label>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="minArea" name="min_area" placeholder="Min" class="px-3 py-2 border rounded-lg">
                                <input type="number" id="maxArea" name="max_area" placeholder="Max" class="px-3 py-2 border rounded-lg">
                            </div>
                        </div>

                        <!-- Price Range -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Price (₹)</label>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="minPrice" name="min_price" placeholder="Min" class="px-3 py-2 border rounded-lg">
                                <input type="number" id="maxPrice" name="max_price" placeholder="Max" class="px-3 py-2 border rounded-lg">
                            </div>
                        </div>

                        <!-- Encumbrance Status -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Encumbrance Status</label>
                            <select id="encumbranceStatus" name="encumbrance_status" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">All</option>
                                <option value="Clear">Clear</option>
                                <option value="Mortgaged">Mortgaged</option>
                                <option value="Disputed">Disputed</option>
                                <option value="Unknown">Unknown</option>
                            </select>
                        </div>

                        <!-- Property Type -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Property Type</label>
                            <select id="propertyType" name="property_type" class="w-full px-3 py-2 border rounded-lg">
                                <option value="">All</option>
                                <option value="Residential">Residential</option>
                                <option value="Commercial">Commercial</option>
                                <option value="Mixed-use">Mixed-use</option>
                            </select>
                        </div>

                        <!-- Buttons -->
                        <div class="space-y-2">
                            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                                Apply Filters
                            </button>
                            <button type="button" id="clearFilters" class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition">
                                Clear Filters
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Results Area -->
            <div class="lg:col-span-3">
                <!-- Results Header -->
                <div class="bg-white p-4 rounded-lg shadow mb-4 flex justify-between items-center">
                    <div>
                        <span class="text-gray-600">Found <strong id="totalResults">0</strong> properties</span>
                    </div>
                    <div>
                        <button id="compareButton" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition disabled:bg-gray-400" disabled>
                            Compare Selected (<span id="selectedCount">0</span>)
                        </button>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="hidden bg-white p-8 rounded-lg shadow text-center">
                    <div class="text-gray-600">Loading properties...</div>
                </div>

                <!-- Results Grid -->
                <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Property cards will be inserted here -->
                </div>

                <!-- Pagination -->
                <div id="pagination" class="mt-6 flex justify-center space-x-2">
                    <!-- Pagination buttons will be inserted here -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="hidden bg-white p-8 rounded-lg shadow text-center">
                    <div class="text-6xl mb-4">🔍</div>
                    <h3 class="text-xl font-semibold mb-2">No properties found</h3>
                    <p class="text-gray-600">Try adjusting your filters</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setupSearchPage();
        });
    </script>
</body>
</html>
